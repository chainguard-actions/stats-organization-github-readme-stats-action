name: Test missing required option fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          card: pin
          # Intentionally omit 'repo' which is required for pin card
          options: "username=anuraghazra"
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action fails when required option is missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when required 'repo' option was missing for pin card"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when 'repo' option is missing for pin card"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
