name: Test stats card generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          card: stats
          options: "username=anuraghazra"
          path: "test-output/stats.svg"
        env:
          PAT_1: ${{ github.token }}

      - name: Assert output path is set
        env:
          ACTUAL: ${{ steps.action.outputs.path }}
        run: |
          echo "actual path output: $ACTUAL"
          if [ "$ACTUAL" != "test-output/stats.svg" ]; then
            echo "FAIL: expected 'test-output/stats.svg' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: output path matches"

      - name: Assert SVG file exists and is non-empty
        run: |
          FILE="$GITHUB_WORKSPACE/test-output/stats.svg"
          echo "Checking file: $FILE"
          if [ ! -f "$FILE" ]; then
            echo "FAIL: SVG file not found at $FILE"
            exit 1
          fi
          SIZE=$(wc -c < "$FILE")
          echo "File size: $SIZE bytes"
          if [ "$SIZE" -lt 100 ]; then
            echo "FAIL: SVG file is too small ($SIZE bytes), expected a real SVG"
            exit 1
          fi
          if ! grep -q "<svg" "$FILE"; then
            echo "FAIL: file does not appear to be an SVG"
            cat "$FILE"
            exit 1
          fi
          echo "PASS: SVG file exists and looks valid"
