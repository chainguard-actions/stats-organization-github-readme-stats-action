name: Test default output path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY_OWNER: anuraghazra
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          card: stats
          options: "username=anuraghazra"
          # No path provided — should default to profile/stats.svg
      - name: Assert default output path
        env:
          ACTUAL: ${{ steps.action.outputs.path }}
        run: |
          echo "actual path: $ACTUAL"
          if [ "$ACTUAL" != "profile/stats.svg" ]; then
            echo "FAIL: expected default output path 'profile/stats.svg', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: default output path is correct"
      - name: Assert SVG file exists at default path
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/profile/stats.svg" ]; then
            echo "FAIL: expected SVG file not found at profile/stats.svg"
            exit 1
          fi
          echo "PASS: SVG file exists at default path"
