name: Test default output path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY_OWNER: anuraghazra
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          card: stats
          options: "username=anuraghazra"
          token: ${{ github.token }}
      - name: Assert default output path is set
        env:
          ACTUAL: ${{ steps.action.outputs.path }}
        run: |
          echo "actual path output: $ACTUAL"
          if [ "$ACTUAL" != "profile/stats.svg" ]; then
            echo "FAIL: expected default output path 'profile/stats.svg', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: default output path matches"
      - name: Assert SVG file was written at default path
        run: |
          echo "Checking for SVG file at profile/stats.svg"
          if [ ! -f "profile/stats.svg" ]; then
            echo "FAIL: SVG file not found at profile/stats.svg"
            exit 1
          fi
          echo "File size: $(wc -c < profile/stats.svg) bytes"
          if ! grep -q "<svg" profile/stats.svg; then
            echo "FAIL: output file does not appear to be an SVG"
            exit 1
          fi
          echo "PASS: SVG file exists at default path and contains SVG content"
