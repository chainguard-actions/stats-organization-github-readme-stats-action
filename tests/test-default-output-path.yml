name: Test default output path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          card: stats
          options: "username=anuraghazra"
          token: ${{ github.token }}
          # No path provided — should default to profile/stats.svg
      - name: Assert output path defaults to profile/stats.svg
        env:
          ACTUAL: ${{ steps.action.outputs.path }}
        run: |
          echo "actual path output: $ACTUAL"
          EXPECTED="profile/stats.svg"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected path '$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: default path is '$ACTUAL'"
      - name: Assert default SVG file exists
        run: |
          if [ ! -f "profile/stats.svg" ]; then
            echo "FAIL: expected SVG file at profile/stats.svg not found"
            exit 1
          fi
          echo "PASS: profile/stats.svg exists"
      - name: Assert default SVG file contains SVG content
        run: |
          CONTENT=$(cat "profile/stats.svg")
          echo "first 200 chars: ${CONTENT:0:200}"
          if ! echo "$CONTENT" | grep -qi "<svg"; then
            echo "FAIL: file does not appear to be an SVG"
            exit 1
          fi
          echo "PASS: file contains SVG content"
