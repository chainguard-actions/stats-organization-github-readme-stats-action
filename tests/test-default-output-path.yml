name: Test default output path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          card: stats
          options: "username=anuraghazra"
          # No 'path' input — should default to profile/stats.svg
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert default output path is profile/stats.svg
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT_PATH: ${{ steps.action.outputs.path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output path: $OUTPUT_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$OUTPUT_PATH" != "profile/stats.svg" ]; then
              echo "FAIL: expected default output path 'profile/stats.svg', got '$OUTPUT_PATH'"
              exit 1
            fi
            echo "PASS: default output path is 'profile/stats.svg'"
            if [ ! -f "$GITHUB_WORKSPACE/profile/stats.svg" ]; then
              echo "FAIL: SVG file not found at $GITHUB_WORKSPACE/profile/stats.svg"
              exit 1
            fi
            echo "PASS: SVG file exists at default path"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely API rate limit or network issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
