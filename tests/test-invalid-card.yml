name: Test invalid card type fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          card: invalid-card-type
          options: "username=anuraghazra"
          path: "output/invalid.svg"
        continue-on-error: true
      - name: Assert action failed with unsupported card type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid card type, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid card type"
      - name: Assert SVG file was NOT created
        run: |
          if [ -f "output/invalid.svg" ]; then
            echo "FAIL: SVG file should not have been created for invalid card type"
            exit 1
          fi
          echo "PASS: SVG file was not created (as expected)"
