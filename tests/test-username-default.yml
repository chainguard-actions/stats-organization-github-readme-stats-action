name: Test username defaults to repository owner
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          card: stats
          # No username in options — should default to GITHUB_REPOSITORY_OWNER
          path: "output/stats-default-user.svg"
      - name: Assert output path matches
        env:
          ACTUAL: ${{ steps.action.outputs.path }}
        run: |
          echo "actual path: $ACTUAL"
          if [ "$ACTUAL" != "output/stats-default-user.svg" ]; then
            echo "FAIL: expected 'output/stats-default-user.svg' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: output path matches"
      - name: Assert SVG file exists and contains SVG content
        run: |
          if [ ! -f "output/stats-default-user.svg" ]; then
            echo "FAIL: SVG file not found at output/stats-default-user.svg"
            exit 1
          fi
          if ! grep -q "<svg" "output/stats-default-user.svg"; then
            echo "FAIL: file does not contain SVG content"
            cat "output/stats-default-user.svg"
            exit 1
          fi
          echo "PASS: SVG file exists and contains SVG content"
