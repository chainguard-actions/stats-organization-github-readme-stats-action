name: Test pin card generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY_OWNER: anuraghazra
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          card: pin
          options: "username=anuraghazra&repo=github-readme-stats"
          path: "output/pin.svg"
      - name: Assert output path is set
        env:
          ACTUAL: ${{ steps.action.outputs.path }}
        run: |
          echo "actual path output: $ACTUAL"
          if [ "$ACTUAL" != "output/pin.svg" ]; then
            echo "FAIL: expected 'output/pin.svg' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: output path matches"
      - name: Assert SVG file exists
        run: |
          if [ ! -f "output/pin.svg" ]; then
            echo "FAIL: SVG file not found at output/pin.svg"
            exit 1
          fi
          echo "PASS: SVG file exists"
      - name: Assert SVG content is valid
        run: |
          content=$(cat output/pin.svg)
          echo "SVG content (first 200 chars): ${content:0:200}"
          if ! echo "$content" | grep -q "<svg"; then
            echo "FAIL: output does not contain <svg tag"
            exit 1
          fi
          echo "PASS: SVG content is valid"
