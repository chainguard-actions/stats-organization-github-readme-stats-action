name: Test pin card generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          card: pin
          options: "username=anuraghazra&repo=github-readme-stats"
          path: "output/pin.svg"
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert pin card output or graceful failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT_PATH: ${{ steps.action.outputs.path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output path: $OUTPUT_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$OUTPUT_PATH" != "output/pin.svg" ]; then
              echo "FAIL: expected output path 'output/pin.svg', got '$OUTPUT_PATH'"
              exit 1
            fi
            echo "PASS: output path matches expected value"
            if [ ! -f "$GITHUB_WORKSPACE/output/pin.svg" ]; then
              echo "FAIL: SVG file not found at $GITHUB_WORKSPACE/output/pin.svg"
              exit 1
            fi
            echo "PASS: SVG file exists"
            if ! grep -q "<svg" "$GITHUB_WORKSPACE/output/pin.svg"; then
              echo "FAIL: file does not appear to be an SVG"
              exit 1
            fi
            echo "PASS: file contains SVG content"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely API rate limit or network issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
