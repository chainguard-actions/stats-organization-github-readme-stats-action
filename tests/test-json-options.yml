name: Test JSON options format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          card: stats
          options: '{"username": "anuraghazra", "show_icons": "true", "theme": "dark"}'
          path: "tests/output/stats-json-opts.svg"
          token: ${{ github.token }}
      - name: Assert JSON options are accepted
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT_PATH: ${{ steps.action.outputs.path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output_path: $OUTPUT_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$OUTPUT_PATH" ]; then
              echo "FAIL: action succeeded but path output is empty"
              exit 1
            fi
            if [ ! -f "$OUTPUT_PATH" ]; then
              echo "FAIL: SVG file not found at $OUTPUT_PATH"
              exit 1
            fi
            if ! grep -q "<svg" "$OUTPUT_PATH"; then
              echo "FAIL: output file does not appear to be an SVG"
              exit 1
            fi
            echo "PASS: stats card generated with JSON options at $OUTPUT_PATH"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely API rate limit or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
