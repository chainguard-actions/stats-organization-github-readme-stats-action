name: Test JSON options format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          card: stats
          # Options provided as JSON instead of query string
          options: '{"username":"anuraghazra","show_icons":"true"}'
          path: "test-output/stats-json-opts.svg"
          token: ${{ github.token }}
      - name: Assert output path is set
        env:
          ACTUAL: ${{ steps.action.outputs.path }}
        run: |
          echo "actual path output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected path output to be non-empty"
            exit 1
          fi
          echo "PASS: path output is set to '$ACTUAL'"
      - name: Assert SVG file exists and contains SVG content
        env:
          OUTPUT_PATH: ${{ steps.action.outputs.path }}
        run: |
          echo "Checking file at: $OUTPUT_PATH"
          if [ ! -f "$OUTPUT_PATH" ]; then
            echo "FAIL: SVG file not found at $OUTPUT_PATH"
            exit 1
          fi
          if ! grep -q "<svg" "$OUTPUT_PATH"; then
            echo "FAIL: file does not contain SVG content"
            cat "$OUTPUT_PATH"
            exit 1
          fi
          echo "PASS: SVG file exists and contains SVG content (JSON options)"
