name: Test JSON options format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          card: stats
          options: '{"username": "anuraghazra", "show_icons": "true"}'
          path: "tests/output/stats-json-opts.svg"
          token: ${{ github.token }}
      - name: Assert output path is set
        env:
          ACTUAL: ${{ steps.action.outputs.path }}
        run: |
          echo "actual path output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected path output to be non-empty"
            exit 1
          fi
          echo "PASS: path output is set to '$ACTUAL'"
      - name: Assert SVG file exists
        env:
          OUT_PATH: ${{ steps.action.outputs.path }}
        run: |
          echo "checking file at: $OUT_PATH"
          if [ ! -f "$OUT_PATH" ]; then
            echo "FAIL: SVG file not found at '$OUT_PATH'"
            exit 1
          fi
          echo "PASS: SVG file exists"
      - name: Assert SVG file contains SVG content
        env:
          OUT_PATH: ${{ steps.action.outputs.path }}
        run: |
          CONTENT=$(cat "$OUT_PATH")
          echo "first 200 chars: ${CONTENT:0:200}"
          if ! echo "$CONTENT" | grep -qi "<svg"; then
            echo "FAIL: file does not appear to be an SVG"
            exit 1
          fi
          echo "PASS: file contains SVG content"
