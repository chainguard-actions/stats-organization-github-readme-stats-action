name: GitHub Readme Stats Action
description: Generate GitHub Readme Stats cards in GitHub Actions.
author: stats-organization
inputs:
  card:
    description: Card type to generate (stats, top-langs, pin, wakatime, gist).
    required: true
  options:
    description: Options for the card (query string or JSON).
    required: false
    default: ""
  path:
    description: Output path for SVG file (relative path; include filename with .svg).
    required: false
    default: ""
  token:
    description: GitHub token (PAT or GITHUB_TOKEN).
    required: false
    default: ""
  core_version:
    description: Version of @stats-organization/github-readme-stats-core to use internally.
    required: false
    default: "v2"
outputs:
  path:
    description: Path where the SVG file was written.
    value: ${{ steps.generate.outputs.path }}
runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    # pnpm/action-setup's `package_json_file` and setup-node's `node-version-file` are both
    # resolved relative to $GITHUB_WORKSPACE, but our package.json lives under
    # ${{ github.action_path }} — convert to a workspace-relative path.
    - name: Compute workspace-relative package.json path
      id: resolve_path
      run: |
        raw=$(realpath --relative-to="$GITHUB_WORKSPACE" "$GITHUB_ACTION_PATH/package.json")
        safe=$(printf '%s' "$raw" | tr -d '\n\r')
        echo "package_json=$safe" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Install pnpm
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      with:
        package_json_file: ${{ steps.resolve_path.outputs.package_json }}
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: ${{ steps.resolve_path.outputs.package_json }}
    - name: Install dependencies
      # --prod skips devDependencies (husky, vitest, etc.); --ignore-scripts skips the
      # husky prepare hook, which would otherwise fail since husky isn't installed.
      # https://github.com/stats-organization/github-readme-stats-action/issues/63
      run: pnpm install --frozen-lockfile --prod --ignore-scripts
      shell: bash
      working-directory: ${{ github.action_path }}
    - name: Generate card
      id: generate
      run: node "$GITHUB_ACTION_PATH/index.js"
      shell: bash
      env:
        INPUT_CARD: ${{ inputs.card }}
        INPUT_OPTIONS: ${{ inputs.options }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_CORE_VERSION: ${{ inputs.core_version }}
        PAT_1: ${{ inputs.token || github.token }}
branding:
  icon: bar-chart-2
  color: blue
